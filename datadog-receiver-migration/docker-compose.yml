services:
  generator:
    build: ./generator
    environment:
      - DD_AGENT_HOST=datadog-agent
    depends_on:
      - datadog-agent

  datadog-agent:
    image: datadog/agent:${DATADOG_AGENT_VERSION:-7.82.2}
    environment:
      - DD_API_KEY=dummy
      - DD_SITE=datadoghq.com
      - DD_DD_URL=http://alloy:8126
      - DD_APM_DD_URL=http://alloy:8126
      - DD_LOGS_ENABLED=false
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_HOSTNAME=datadog-agent
    depends_on:
      - alloy

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.18.1}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --stability.level=experimental /etc/alloy/config.alloy
    ports:
      - 8126:8126
    depends_on:
      - prometheus
      - tempo

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.13.1}
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prom-config.yaml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090

  tempo:
    image: grafana/tempo:${GRAFANA_TEMPO_VERSION:-2.10.7}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
    ports:
      - 3200:3200

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - 3000:3000
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Prometheus
          type: prometheus
          orgId: 1
          url: http://prometheus:9090
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        - name: Tempo
          type: tempo
          access: proxy
          orgId: 1
          url: http://tempo:3200
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
          jsonData:
            serviceMap:
              datasourceUid: 'Prometheus'
            nodeGraph:
              enabled: true
        EOF
        /run.sh
    depends_on:
      - prometheus
      - tempo
