services:
  # Continuously writes mixed-severity JSON logs for one application stream.
  log-generator:
    image: python:${PYTHON_VERSION:-3.11-slim}
    volumes:
      - ./app/generate_logs.py:/app/generate_logs.py:ro
      - ./logs:/logs
    command: python3 /app/generate_logs.py
    depends_on:
      - alloy

  # Samples low-severity logs, caps their throughput per stream, and keeps WARN/ERROR.
  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.19.2}
    ports:
      - 12345:12345/tcp
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/demo
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki

  loki:
    image: grafana/loki:${GRAFANA_LOKI_VERSION:-3.7.8}
    ports:
      - 3100:3100/tcp
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - 3000:3000/tcp
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
    depends_on:
      - loki
