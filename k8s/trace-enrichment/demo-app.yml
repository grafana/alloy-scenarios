# Two replicas of telemetrygen that send a steady stream of spans to Alloy.
# telemetrygen only sets service.name, so every k8s.* attribute you see in
# Tempo was added by otelcol.processor.k8sattributes.
apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: prod
  labels:
    app.kubernetes.io/name: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.165.1
          args:
            - traces
            - --otlp-endpoint=alloy.meta.svc.cluster.local:4317
            - --otlp-insecure
            - --service=checkout
            - --duration=inf
            - --rate=1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
