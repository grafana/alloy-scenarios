# Ship session logs, metrics and traces to Grafana Cloud.
#   cp .env.example .env   # then fill it in, or run create_access_policy.py
#   docker compose up -d
services:
  alloy:
    restart: unless-stopped
    image: grafana/alloy:${WOW_GRAFANA_ALLOY_VERSION:-v1.22.0}
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${ALLOYROUTE_EXPORT_DIR:-../exports}:/exports:ro
      - alloy-data:/var/lib/alloy/data

  signals:
    build:
      context: ../companion
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11-slim}
    restart: unless-stopped
    volumes:
      - ${ALLOYROUTE_EXPORT_DIR:-../exports}:/exports:ro
      - ${ALLOYROUTE_EXPORT_DIR:-../exports}/.delivery:/state
    depends_on:
      - alloy

volumes:
  alloy-data:
