services:
  alloy:
    image: grafana/alloy:${WOW_GRAFANA_ALLOY_VERSION:-v1.22.0}
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro

  prometheus:
    image: prom/prometheus:${WOW_PROMETHEUS_VERSION:-v3.16.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ./prom-config.yaml:/etc/prometheus/prometheus.yml:ro
      - metrics:/prometheus

  loki:
    image: grafana/loki:${WOW_GRAFANA_LOKI_VERSION:-3.7.10}
    command:
      - -config.file=/etc/loki/scenario.yaml
      - -ingester.wal-disk-full-threshold=${LOKI_WAL_DISK_THRESHOLD:-0.90}
    volumes:
      - ./loki-config.yaml:/etc/loki/scenario.yaml:ro
      - logs:/loki

  tempo:
    image: grafana/tempo:${WOW_GRAFANA_TEMPO_VERSION:-2.10.10}
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - traces:/var/tempo

  pyroscope:
    image: grafana/pyroscope:${WOW_GRAFANA_PYROSCOPE_VERSION:-2.4.4}
    volumes:
      - profiles:/data
      - profile_metadata:/data-metastore
      - profile_compaction:/data-compactor

  grafana:
    image: grafana/grafana:${WOW_GRAFANA_VERSION:-13.3.2}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.8
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: alloy-journeyatlas-panel
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/progression.json
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/scenario.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/scenario.yaml:ro
      - ./grafana/atlas:/var/lib/grafana/plugins/alloy-journeyatlas-panel:ro
      - ./grafana/journey.json:/var/lib/grafana/dashboards/journey.json:ro
      - ./grafana/progression.json:/var/lib/grafana/dashboards/progression.json:ro

volumes:
  metrics:
  logs:
  traces:
  profiles:
  profile_metadata:
  profile_compaction:
