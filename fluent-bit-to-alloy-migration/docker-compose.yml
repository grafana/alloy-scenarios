services:
  # Writes /var/log/demo/app.log (multi-line logfmt) and
  # /var/log/demo/orders.json (JSON lines). Both collectors tail both
  # files, which is what makes their output directly comparable in Loki.
  log-generator:
    image: python:${PYTHON_VERSION:-3.11-slim}
    volumes:
      - ./main.py:/main.py
      - ./logs:/var/log/demo
    command: ["python3", "/main.py"]

  # The "before": Fluent Bit running fluent-bit.yaml. fluent-bit.conf and
  # parsers.conf in this directory are the classic-mode equivalent, kept
  # for reference and deliberately not mounted. The command override is
  # required: the image defaults to /fluent-bit/etc/fluent-bit.conf, and
  # Fluent Bit picks its config parser by file extension.
  fluent-bit:
    image: fluent/fluent-bit:${FLUENT_BIT_VERSION:-5.1.0}
    ports:
      - 2020:2020
    volumes:
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml
      # Same mount path as the Alloy container so Fluent Bit's path_key
      # and Alloy's filename label carry the same value.
      - ./logs:/var/log/demo:ro
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    depends_on:
      - loki
      - log-generator

  # The "after": the same two pipelines written as Alloy components.
  # Hand-written -- `alloy convert` has no fluent-bit source format.
  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    ports:
      - 12345:12345
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - ./logs:/var/log/demo:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
      - log-generator

  loki:
    image: grafana/loki:${GRAFANA_LOKI_VERSION:-3.7.3}
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - 3000:3000/tcp
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    depends_on:
      - loki
