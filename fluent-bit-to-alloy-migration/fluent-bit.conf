# Classic-mode equivalent of fluent-bit.yaml, for reference only. This
# file is NOT mounted into the container: fluent-bit.yaml is the config
# that actually runs. Classic mode is deprecated at the end of 2026, so
# if your deployment still looks like this, the YAML file next to it is
# the shape to move to first. Parsers live in parsers.conf because
# classic mode has no inline parser section.
#
# One block below is not equivalent, and it isn't a transcription error.
# Refer to the note above the second [OUTPUT].

[SERVICE]
    Flush            1
    Log_Level        info
    HTTP_Server      On
    HTTP_Listen      0.0.0.0
    HTTP_Port        2020
    Parsers_File     /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Alias             text
    Tag               app.text
    Path              /var/log/demo/app.log
    Path_Key          filename
    Read_from_Head    On
    Refresh_Interval  10
    DB                /tmp/fluent-bit-text.db
    multiline.parser  app_ml

[INPUT]
    Name              tail
    Alias             json
    Tag               app.json
    Path              /var/log/demo/orders.json
    Path_Key          filename
    Read_from_Head    On
    Refresh_Interval  10
    DB                /tmp/fluent-bit-json.db

[FILTER]
    Name          parser
    Match         app.text
    Key_Name      log
    Parser        app_kv
    Preserve_Key  On
    Reserve_Data  On

[FILTER]
    Name          parser
    Match         app.text
    Key_Name      log
    Parser        app_trim
    Preserve_Key  Off
    Reserve_Data  On

[FILTER]
    Name          parser
    Match         app.json
    Key_Name      log
    Parser        orders_json
    Preserve_Key  On
    Reserve_Data  On

[OUTPUT]
    Name             loki
    Match            app.text
    Host             loki
    Port             3100
    Labels           job=demo-app,collector=fluentbit
    Label_Keys       $level,$service,$filename
    Line_Format      json
    Drop_Single_Key  raw

# Remove_Keys has no effect in classic mode. Fluent Bit accepts the
# property, and rejects the config if you set it twice, but never applies
# it. Tested on 5.1.0 and 4.2.8. Drop_Single_Key therefore never fires
# here, and this stream reaches Loki as a JSON object wrapping the
# original line rather than the line itself. The same pipeline in
# fluent-bit.yaml emits the raw line. If you need remove_keys, that is a
# reason to move to YAML today rather than at the deprecation deadline.
[OUTPUT]
    Name                 loki
    Match                app.json
    Host                 loki
    Port                 3100
    Labels               job=demo-app,collector=fluentbit
    Label_Keys           $level,$service,$filename
    Structured_Metadata  trace_id=$trace_id
    Remove_Keys          ts,trace_id,msg
    Line_Format          json
    Drop_Single_Key      raw
